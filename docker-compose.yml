services:
  postgres:
    image: postgres:16-alpine
    container_name: flight_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flight_tracker_db}
      POSTGRES_USER: ${POSTGRES_USER:-tracker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker_user} -d ${POSTGRES_DB:-flight_tracker_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flight_network

  redis:
    image: redis:7-alpine
    container_name: flight_tracker_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flight_network

  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - flight_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flight_tracker_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flight_tracker_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tracker_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tracker_secret}
      SPRING_MAIL_HOST: ${MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@flight-tracker.test}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_PUBLIC_BASE_URL: ${MAIL_PUBLIC_BASE_URL:-http://localhost:8080}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AVIATION_API_BASE_URL: ${AVIATION_API_BASE_URL:-https://api.aviationstack.com/v1}
      AVIATION_API_KEY: ${AVIATION_API_KEY:-}
      SCHEDULER_POLLER_ENABLED: ${SCHEDULER_POLLER_ENABLED:-false}
      SCHEDULER_POLLER_DELAY_MS: ${SCHEDULER_POLLER_DELAY_MS:-86400000}
      SCHEDULER_POLLER_MAX_FLIGHTS: ${SCHEDULER_POLLER_MAX_FLIGHTS:-5}
    networks:
      - flight_network
    dns:
      - 1.1.1.1
      - 8.8.8.8

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flight_tracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flight_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  flight_network:
    driver: bridge
