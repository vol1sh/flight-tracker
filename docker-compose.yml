services:
  postgres:
    image: postgres:16-alpine
    container_name: flight_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flight_tracker_db}
      POSTGRES_USER: ${POSTGRES_USER:-tracker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker_secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker_user} -d ${POSTGRES_DB:-flight_tracker_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flight_network

  redis:
    image: redis:7-alpine
    container_name: flight_tracker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flight_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flight_tracker_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flight_tracker_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tracker_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tracker_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - flight_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flight_tracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - flight_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  flight_network:
    driver: bridge
