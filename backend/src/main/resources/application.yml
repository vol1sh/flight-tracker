server:
  port: 8080

spring:
  application:
    name: flight-tracker-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flight_tracker_db}
    username: ${SPRING_DATASOURCE_USERNAME:tracker_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tracker_secret}
    driver-class-name: org.postgresql.Driver
  task:
    scheduling:
      pool:
        size: 2
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  health:
    # Flight search/analytics remain available while delivery is queued for retry.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@flight-tracker.test}
    public-base-url: ${MAIL_PUBLIC_BASE_URL:http://localhost:8080}
    outbox-delay-ms: ${MAIL_OUTBOX_DELAY_MS:10000}
  aviation-api:
    base-url: ${AVIATION_API_BASE_URL:https://api.aviationstack.com/v1}
    key: ${AVIATION_API_KEY:}
    connect-timeout-ms: ${AVIATION_API_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AVIATION_API_READ_TIMEOUT_MS:10000}
  scheduler:
    flight-poller:
      enabled: ${SCHEDULER_POLLER_ENABLED:false}
      fixed-delay-ms: ${SCHEDULER_POLLER_DELAY_MS:86400000}
      # Не больше N рейсов за цикл и только даты [сегодня-1; сегодня+1] (UTC) — защита квоты AviationStack.
      max-flights-per-cycle: ${SCHEDULER_POLLER_MAX_FLIGHTS:5}
      date-window-days: ${SCHEDULER_POLLER_DATE_WINDOW_DAYS:1}

# 404 (рейс подтверждённо не найден) и ошибки доступа — не сбои провайдера, не должны размыкать цепь.
resilience4j:
  circuitbreaker:
    instances:
      aviationApi:
        ignore-exceptions:
          - org.springframework.web.server.ResponseStatusException
          - com.tracker.flight.client.exception.AviationAccessException
