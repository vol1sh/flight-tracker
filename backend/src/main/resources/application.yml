server:
  port: 8080

spring:
  application:
    name: flight-tracker-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flight_tracker_db}
    username: ${SPRING_DATASOURCE_USERNAME:tracker_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tracker_secret}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  aviation-api:
    base-url: ${AVIATION_API_BASE_URL:http://api.aviationstack.com/v1}
    key: ${AVIATION_API_KEY:}
  scheduler:
    flight-poller:
      enabled: ${SCHEDULER_POLLER_ENABLED:false}
      fixed-delay-ms: ${SCHEDULER_POLLER_DELAY_MS:86400000}
