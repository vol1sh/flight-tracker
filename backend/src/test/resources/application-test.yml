spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/flight_tracker_db
    username: tracker_user
    password: tracker_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
